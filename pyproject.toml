[project]
name = "boe-earnings-insights"
version = "0.1.0"
description = "Bank of England earnings-call insights factory (Cambridge DS Accelerator, Group 9)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
# Lightweight stack: pytest CI installs this plus the `test` extra, and does
# not pull torch / BERTopic. Notebook and Colab add the `ml` extra.
dependencies = [
    "pandas==3.0.6",
    "numpy==2.5.3",
    "scikit-learn==1.9.1",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-cov",
]
# Notebook deps — mirrored from CAM C301 course venv (Python 3.12)
ml = [
    "nltk==3.10.3",
    "bertopic==0.17.4",
    "sentence-transformers==6.1.0",
    "gensim==4.4.0",
    "transformers==5.19.0",
    "torch==2.14.1",
    "matplotlib==3.11.2",
    "seaborn>=0.13",
    "umap-learn==0.5.12",
    "hdbscan==0.8.44",
    "plotly==7.1.0",
    "ipykernel==7.4.0",
    "pypdf==6.19.0",
    "pdfplumber>=0.11",
    "yfinance>=0.2.40",  # unofficial Yahoo news scraper, recency-limited
    "pyarrow>=14",
    # Torch is the scorer stack. Do not add tensorflow: umap's unused
    # ParametricUMAP imports it and can raise a protobuf VersionError.
    "tf-keras>=2.17",
    "datasets>=2.14",
    "accelerate>=0.26",
    "evaluate>=0.4",
    "pysentiment2>=0.1.1",  # Loughran–McDonald master dictionary
    "streamlit>=1.32",      # PRA desk: streamlit run demo/app.py
]
notebook = [
    "papermill",
    "nbformat",
    "nbclient",
]

[tool.uv]
package = false

# Linux CI must not pull the ~2 GB CUDA wheel. macOS/Windows keep the
# default PyPI build (MPS on Apple Silicon).
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
]
