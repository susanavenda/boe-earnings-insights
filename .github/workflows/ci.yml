name: tests

on:
  push:
    branches: [main, susana/a2-share]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install lightweight test deps
        # Project deps + test extra from the lock. Does not install torch/BERTopic.
        run: uv sync --frozen --extra test
      - name: Run tests
        run: uv run pytest tests/ -q -m "not slow" --cov=scripts --cov-config=.coveragerc --cov-report=term-missing
        env:
          OPENAI_API_KEY: ""
          GEMINI_API_KEY: ""
          GOOGLE_API_KEY: ""
          BOE_LLM_PROVIDER: ""
          BOE_USE_LLM_PREPROCESSING: ""
