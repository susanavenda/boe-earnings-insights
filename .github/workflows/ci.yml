name: tests

on:
  push:
    branches: [main, susana/a2-share]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install lightweight test deps
        # Versions come from requirements.txt so CI matches the notebook.
        # -c constrains only; it does not install torch/BERTopic.
        run: pip install -c requirements.txt pytest pytest-cov pandas numpy scikit-learn openpyxl
      - name: Run tests
        run: pytest tests/ -q -m "not slow" --cov=scripts --cov-config=.coveragerc --cov-report=term-missing
        env:
          OPENAI_API_KEY: ""
          GEMINI_API_KEY: ""
          GOOGLE_API_KEY: ""
          BOE_LLM_PROVIDER: ""
          BOE_USE_LLM_PREPROCESSING: ""
