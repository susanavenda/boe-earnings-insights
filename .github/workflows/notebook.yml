name: notebook

# Full top-to-bottom run of notebooks/boe_earnings_insights.ipynb on a fresh kernel.
# Slow (~45-90 min), so it does not run on every PR. It runs:
#   - manually (Actions -> notebook -> Run workflow)
#   - on push to main when the notebook, scripts, data or lockfile change
#   - on a PR once it has the label "run-notebook"
# The executed notebook is uploaded as an artifact, including when a cell fails.
# If every cell runs cleanly on a PR (or a manual run on a branch other than main),
# the executed notebook is committed back to that branch, so the PR carries the outputs.
# Pushes made with the workflow token do not trigger new workflow runs, so this cannot loop.
# Manual run with a non-blank release_tag publishes executed.ipynb + data/exports
# as GitHub Release prefix-<short-sha> (re-run of the same commit appends the run id).

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release prefix (blank = none). Tag becomes prefix-plus-short-sha, e.g. a3-final-dd98ac9"
        required: false
        default: ""
  push:
    branches: [main]
    paths:
      - "notebooks/**"
      - "scripts/**"
      - "data/**"
      - "pyproject.toml"
      - "uv.lock"
      - "requirements.txt"
      - ".github/workflows/notebook.yml"
  pull_request:
    types: [labeled, synchronize]

permissions:
  contents: write

concurrency:
  group: notebook-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run-notebook:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'run-notebook')
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      BOE_ROOT: ${{ github.workspace }}
      # LLM passes stay off: the notebook skips them when no key is set.
      OPENAI_API_KEY: ""
      GEMINI_API_KEY: ""
      GOOGLE_API_KEY: ""
      BOE_LLM_PROVIDER: ""
      BOE_USE_LLM_PREPROCESSING: ""
      BOE_USE_ABSTRACTIVE_SUMMARIES: "0"
      GITHUB_TOKEN: ""
      PYTHONUTF8: "1"
      MPLBACKEND: Agg
      TOKENIZERS_PARALLELISM: "false"
      HF_HOME: ${{ github.workspace }}/.cache/huggingface
      NLTK_DATA: ${{ github.workspace }}/.cache/nltk_data
    steps:
      - uses: actions/checkout@v5
        with:
          # The PR branch itself (not the merge preview), so the result can be pushed back to it.
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Cache model downloads (FinBERT, sentence-transformers, NLTK)
        uses: actions/cache@v4
        with:
          path: |
            .cache/huggingface
            .cache/nltk_data
          key: models-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: models-${{ runner.os }}-

      - name: Install dependencies (CPU torch on Linux)
        run: |
          uv sync --frozen --all-extras
          uv run python -m ipykernel install --user --name python3

      - name: Execute notebook top to bottom
        working-directory: notebooks
        run: |
          uv run papermill boe_earnings_insights.ipynb ../executed.ipynb \
            --kernel python3 \
            --log-output \
            --progress-bar

      - name: Run tests that need the built database and topic models
        run: uv run pytest tests/ -q -m "not slow" -rs

      - name: Check every code cell ran without errors
        if: ${{ !cancelled() }}
        run: |
          uv run python - <<'EOF'
          import sys
          from pathlib import Path
          import nbformat
          p = Path("executed.ipynb")
          if not p.exists():
              sys.exit("executed.ipynb was not written (papermill failed before the first cell)")
          nb = nbformat.read(p, as_version=4)
          code = [(i, c) for i, c in enumerate(nb.cells) if c.cell_type == "code"]
          unrun = [i for i, c in code if c.get("execution_count") is None]
          errors = [(i, o.get("ename"), o.get("evalue", "")[:200])
                    for i, c in code for o in c.get("outputs", [])
                    if o.get("output_type") == "error"]
          print(f"code cells: {len(code)}  unrun: {len(unrun)}  errors: {len(errors)}")
          for i, name, msg in errors:
              print(f"  cell {i}: {name}: {msg}")
          if errors or unrun:
              print(f"unrun cells: {unrun[:20]}")
              sys.exit(1)
          EOF

      - name: Export submission tables
        # Only from a clean run, so the CSVs always match a green executed.ipynb.
        if: success()
        run: uv run python scripts/export_tables.py

      - name: Upload executed notebook and submission tables
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: executed-notebook
          path: |
            executed.ipynb
            data/exports/
          retention-days: 14

      - name: Publish release
        if: success() && github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
        env:
          # Job env blanks GITHUB_TOKEN so the notebook cannot call GitHub; restore it for gh.
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mkdir -p release
          cp executed.ipynb release/boe_earnings_insights_executed.ipynb
          cp data/exports/MANIFEST.md release/
          (cd data && zip -qr ../release/data_exports.zip exports)
          SHORT_SHA="${GITHUB_SHA:0:7}"
          TAG="${{ inputs.release_tag }}-${SHORT_SHA}"
          # Same commit re-run: keep the job green with a unique suffix.
          if gh release view "$TAG" >/dev/null 2>&1; then
            TAG="${TAG}-${{ github.run_id }}"
          fi
          gh release create "$TAG" release/* \
            --target "${{ github.sha }}" \
            --title "$TAG" \
            --notes "Notebook run ${{ github.run_id }} (${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}), commit ${{ github.sha }}. See MANIFEST.md."
          echo "Published release $TAG"

      - name: Commit executed notebook back to the branch
        # Only after a clean run; PRs from forks get a read-only token, so they are skipped.
        if: >-
          success() &&
          github.ref_name != 'main' &&
          (github.event_name == 'workflow_dispatch' ||
           (github.event_name == 'pull_request' &&
            github.event.pull_request.head.repo.full_name == github.repository))
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          cp executed.ipynb notebooks/boe_earnings_insights.ipynb
          if git diff --quiet -- notebooks/boe_earnings_insights.ipynb; then
            echo "Notebook unchanged; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add notebooks/boe_earnings_insights.ipynb
          git commit -m "Notebook executed top to bottom in CI (run ${{ github.run_id }})"
          # Someone may have pushed during the 45-90 min run. Do not overwrite their work.
          if ! git push origin "HEAD:${BRANCH}"; then
            echo "::warning::The branch moved during the run, so the executed notebook was not pushed. Download it from the artifact or re-run."
          fi
