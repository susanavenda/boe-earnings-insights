name: install-ml

# Linux install smoke tests — Colab pip path and CPU torch on the runner.
# Does not execute the notebook.

on:
  pull_request:
    paths:
      - "requirements.txt"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/install-ml.yml"
  workflow_dispatch:

jobs:
  colab-pip:
    name: pip install -r requirements.txt (Colab)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: pip install like Colab
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Import stack and assert CPU torch
        run: python .github/workflows/check_cpu_torch.py

  uv-cpu-torch:
    name: uv sync --all-extras (CPU torch)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install notebook extras
        run: uv sync --frozen --all-extras
      - name: Import stack and assert CPU torch
        run: uv run python .github/workflows/check_cpu_torch.py
